apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dotnet-ingress
  namespace: dotnetapp
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: 13-71-49-132.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dotnet-service
            port:
              number: 80

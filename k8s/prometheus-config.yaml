apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: dotnetapp
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      # scrape Kubernetes components
      - job_name: 'kubernetes'
        kubernetes_sd_configs:
          - role: pod

      # scrape your .NET app
      - job_name: 'dotnet-app'
        static_configs:
          - targets: ['dotnet-service:80']   # <-- your app service

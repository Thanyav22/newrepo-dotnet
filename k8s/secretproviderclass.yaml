apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv
  namespace: dotnetapp
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"                # Don't use pod identity
    clientID: "${{ secrets.SP_APP_ID }}"   # Service Principal App ID
    clientSecret: "${{ secrets.SP_PASSWORD }}" # Service Principal Secret
    tenantId: "${{ secrets.AZURE_TENANT_ID }}"
    keyvaultName: devopsdemothanya
    objects: |
      array:
        - |
          objectName: dbpassword
          objectType: secret

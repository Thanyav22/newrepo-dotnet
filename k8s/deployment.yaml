apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-deployment
  namespace: dotnetapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotnetapp
  template:
    metadata:
      labels:
        app: dotnetapp
    spec:
      containers:
      - name: dotnetapp
        image: ${{ secrets.ACR_LOGIN }}/dotnetapp:latest
        ports:
        - containerPort: 80
      imagePullSecrets:
      - name: acr-secret

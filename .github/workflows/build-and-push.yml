name: CI

on:
  push:
    branches:
      - nonroot

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0'

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

      # ✅ Fixed SonarQube section
      - name: Install/Update SonarScanner
        run: |
          dotnet tool update --global dotnet-sonarscanner || dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: SonarQube Begin Analysis
        run: dotnet-sonarscanner begin /k:"newrepo-dotnet" /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

      - name: Build .NET Project
        run: dotnet build --configuration Release

      - name: SonarQube End Analysis
        run: dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

      # Docker build + scan + push
      - name: Login to ACR
        run: echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_LOGIN }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{ secrets.ACR_LOGIN }}/dotnetapp:latest .

      - name: Scan Docker Image with Trivy
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format table \
            ${{ secrets.ACR_LOGIN }}/dotnetapp:latest           

      - name: Push Docker Image
        run: docker push ${{ secrets.ACR_LOGIN }}/dotnetapp:latest

name: Build and Push .NET Docker Image

on:
  push:
    branches:
      - nonroot

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0'

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build .NET Project
        run: dotnet build --configuration Release --no-restore
        
      - name: Build Docker Image
        run: |
          docker build -t githubrunner2701.azurecr.io/dotnetapp:latest .
          
      - name: Scan Docker Image with Trivy
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL githubrunner2701.azurecr.io/dotnetapp:latest

      - name: Login to ACR
        run: |
          run: echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_LOGIN }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Push Docker Image to ACR
        run: |
          docker push githubrunner2701.azurecr.io/dotnetapp:latest




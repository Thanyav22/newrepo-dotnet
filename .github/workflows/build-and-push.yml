name: Build and Push .NET Docker Image

on:
  push:
    branches:
      - nonroot

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0'

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

      - name: Login to ACR
        run: echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_LOGIN }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{ secrets.ACR_LOGIN }}/dotnetapp:latest .

      - name: Scan Docker Image with Trivy
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --timeout 5m \
            --format table \
            ${{ secrets.ACR_LOGIN }}/dotnetapp:${{ github.sha }}            

      - name: Push Docker Image
        run: docker push ${{ secrets.ACR_LOGIN }}/dotnetapp:latest
